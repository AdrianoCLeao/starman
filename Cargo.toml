[workspace]
resolver = "2"
members = [
    "crates/engine-diagnostics",
    "crates/engine-reflect",
    "crates/engine-reflect-derive",
    "crates/engine-editor",
    "crates/engine-core",
    "crates/engine-render",
    "crates/engine-physics",
    "crates/engine-audio",
    "crates/engine-input",
    "crates/engine-assets",
    "crates/engine-project",
    "crates/engine-math",
    "examples/game-runner",
    "examples/engine-smoke",
    "examples/sandbox",
    "tools/engine-benchmarks",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Adriano Leao"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bevy_ecs = { version = "0.15", default-features = false }
bevy_reflect = { version = "0.15", features = ["glam"] }
bytemuck = { version = "1.19", features = ["derive"] }
wgpu = { version = "24", default-features = false, features = ["wgsl", "dx12", "metal", "vulkan-portability", "webgpu"] }
winit = { version = "0.30" }
glam = { version = "0.29", features = ["serde"] }
rapier3d = { version = "0.22" }
rapier2d = { version = "0.22" }
kira = { version = "0.9", default-features = false, features = ["cpal", "ogg", "wav", "mp3"] }
cpal = { version = "0.15" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
gltf = { version = "1.4" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"
notify = "6"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
blake3 = "1"
gilrs = "0.11"
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
criterion = { version = "0.5", features = ["html_reports"] }
anyhow = "1"
thiserror = "1"
egui = "0.31"
eframe = { version = "0.31", features = ["wgpu"] }
egui_dock = { version = "0.16", features = ["serde"] }
egui-wgpu = "0.31"
egui-winit = "0.31"
rfd = "0.15"
dirs = "5"
