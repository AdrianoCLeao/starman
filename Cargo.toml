[workspace]
resolver = "2"
members = [
    "crates/engine-diagnostics",
    "crates/engine-reflect",
    "crates/engine-reflect-derive",
    "crates/engine-editor",
    "crates/engine-core",
    "crates/engine-render",
    "crates/engine-physics",
    "crates/engine-animation",
    "crates/engine-vfx",
    "crates/engine-localization",
    "crates/engine-ui",
    "crates/engine-audio",
    "crates/engine-input",
    "crates/engine-assets",
    "crates/engine-scene",
    "crates/engine-plugin",
    "crates/starman-plugin-sdk",
    "crates/engine-lua",
    "crates/engine-project",
    "crates/engine-runtime",
    "crates/engine-runner",
    "crates/starman-cli",
    "crates/engine-math",
    "examples/game-runner",
    "examples/engine-smoke",
    "examples/sandbox",
    "examples/plugins/example_gameplay",
    "tools/engine-benchmarks",
    "tools/content-gen",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Adriano Leao"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bevy_ecs = { version = "0.15", default-features = false }
bevy_reflect = { version = "0.15", features = ["glam"] }
bytemuck = { version = "1.19", features = ["derive"] }
wgpu = { version = "24", default-features = false, features = ["wgsl", "dx12", "metal", "vulkan-portability", "webgpu"] }
winit = { version = "0.30", features = ["serde"] }
glam = { version = "0.29", features = ["serde", "mint"] }
rapier3d = { version = "0.22" }
rapier2d = { version = "0.22" }
kira = { version = "0.12", default-features = false, features = ["cpal", "ogg", "vorbis", "wav", "pcm", "mp3"] }
cpal = { version = "0.15" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "hdr"] }
gltf = { version = "1.4" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fluent-bundle = "0.16"
unic-langid = "0.9"
taffy = "0.14"
cosmic-text = "0.19"
ron = "0.8"
notify = "6"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
blake3 = "1"
clap = { version = "4", features = ["derive"] }
gilrs = { version = "0.11", features = ["serde-serialize"] }
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
criterion = { version = "0.5", features = ["html_reports"] }
anyhow = "1"
thiserror = "1"
egui = "0.31"
eframe = { version = "0.31", features = ["wgpu"] }
egui_dock = { version = "0.16", features = ["serde"] }
egui-wgpu = "0.31"
egui-winit = "0.31"
rfd = "0.15"
dirs = "5"
libloading = "0.8"
mlua = { version = "0.10", features = ["lua54", "vendored", "serialize"] }
glob = "0.3"
